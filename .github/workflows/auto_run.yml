name: Run Script Automatically 24 Hours

on:
  schedule:
    # Berjalan otomatis tanpa henti setiap 5 menit sekali selama 24 jam
    - cron: '*/5 * * * *'
  
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
    
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Menjalankan file bernama UTU menggunakan python
    - name: Execute Script
      run: python UTU
      
